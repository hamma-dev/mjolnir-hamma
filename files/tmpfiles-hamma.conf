# Runtime state directory for HAMMA tmpfs files, installed to /etc/tmpfiles.d/.
#
# hamma_scrub.py (heartbeat + MJ-scan cache) and the state_monitor plugin
# (drive-target latch) keep their live state on tmpfs so it stays writable when
# the SD root fills -- the recurring incident these checks exist to survive
# (HAM-112/113).
#
# It must not be /dev/shm. systemd-logind's RemoveIPC=yes, the compiled-in
# default, deletes every object in /dev/shm owned by a user once that user's
# last login session ends, so a routine `ssh pi@sensor` logout wiped all three
# files. /run is tmpfs, cleared on reboot (which is wanted: a rebooted unit
# re-evaluates from scratch), and RemoveIPC does not touch it.
#
# Owned by pi because brokkr and hamma-scrub.service both run as User=pi and
# pi cannot create a directory under /run itself.
d /run/hamma 0755 pi pi -
